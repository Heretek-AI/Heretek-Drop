name: CI

# Cancel outdated in-progress runs of the same workflow on the same PR
# when a new commit is pushed. Avoids redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Workflow lint ─────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # ── Secret scanning ───────────────────────────────────────────────
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run betterleaks
        uses: docker://ghcr.io/betterleaks/betterleaks:latest
        with:
          args: "dir . --verbose"

  # ── Dependency review ─────────────────────────────────────────────
  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Shellcheck on shell scripts ───────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) \
            -not -path './upstream/*' \
            -not -path './.git/*' \
            -not -path './target/*' \
            -not -path './.husky/*' \
            -exec shellcheck --severity=warning {} +

  # ── Hadolint (deferred — no Dockerfile in v0.1) ───────────────────
  # hadolint:
  #   name: hadolint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: docker://hadolint/hadolint:v2.13.0-beta1
  #       with:
  #         args: --no-fail Dockerfile

  # ── Cargo deny (license + ban + advisory) ─────────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop -> target"
          key: ${{ hashFiles('Cargo.lock') }}
          shared-key: "heretek-drop"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check

  # ── Rust formatting ──────────────────────────────────────────────
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop -> target"
          key: ${{ hashFiles('Cargo.lock') }}
          shared-key: "heretek-drop"
      - run: cargo fmt --all -- --check

  # ── Doc integrity (catches broken intra-doc links) ──────────────
  cargo-doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop -> target"
          key: ${{ hashFiles('Cargo.lock') }}
          shared-key: "heretek-drop"
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  # ── Dependency vulnerability scan ────────────────────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
