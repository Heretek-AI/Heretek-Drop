name: CI

# Cancel outdated in-progress runs of the same workflow on the same PR
# when a new commit is pushed. Avoids redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Workflow lint ─────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # ── Secret scanning ───────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run gitleaks
        uses: docker://zricethezav/gitleaks:v8
        args: detect --source=. --redact --verbose

  # ── Dependency review ─────────────────────────────────────────────
  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Shellcheck on shell scripts ───────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) \
            -not -path './upstream/*' \
            -not -path './.git/*' \
            -not -path './target/*' \
            | xargs -r shellcheck --severity=warning

  # ── Hadolint (deferred — no Dockerfile in v0.1) ───────────────────
  # hadolint:
  #   name: hadolint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: docker://hadolint/hadolint:v2.13.0-beta1
  #       with:
  #         args: --no-fail Dockerfile

  # ── Cargo deny (license + ban + advisory) ─────────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check
