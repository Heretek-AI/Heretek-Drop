name: EditorConfig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-editorconfig:
    name: EditorConfig Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Validate .editorconfig compliance
        run: |
          pnpm dlx editorconfig-checker@6.1.1 --exclude \
            '(node_modules|\.git|\.nuxt|\.output|coverage|dist|target|\.omo|\.codegraph|\.opencode|\.dockerignore|README\.md|LICENSE|AGPL-3\.0\.LICENSE|upstream|\.agents|\.husky|\.flatpak-builder|pnpm-lock\.yaml|Cargo\.lock|package\.json)'
