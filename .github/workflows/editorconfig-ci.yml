name: EditorConfig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-editorconfig:
    name: EditorConfig Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Validate .editorconfig compliance
        run: |
          pnpm dlx editorconfig-checker@6.1.1 --exclude \
            '(node_modules|\.git|\.nuxt|\.output|coverage|dist|target|\.omo|\.codegraph|\.opencode|\.dockerignore|README\.md|LICENSE|AGPL-3\.0\.LICENSE|upstream|\.agents|\.husky|\.flatpak-builder|pnpm-lock\.yaml|Cargo\.lock)'
