version: 2

# Native Rust + Slint project. Cargo workspace at apps/desktop/ with
# sub-crates at apps/desktop/crates/*. Flatpak manifest at
# apps/desktop/flatpak/. pnpm workspace at root for tooling only.

updates:
  # ----- pnpm workspace (root, covers apps/* + packages/*) -----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      node-minor:
        update-types: ["minor", "patch"]
      node-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "javascript"]
    rebase-strategy: "auto"

  # ----- Rust workspace (heretek-drop) -----
  - package-ecosystem: "cargo"
    directory: "/apps/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: ["minor", "patch"]
      rust-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps(rust)"
    labels: ["dependencies", "rust"]

  # ----- Flatpak manifest -----
  - package-ecosystem: "docker"
    directory: "/apps/desktop/flatpak"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(flatpak)"
    labels: ["dependencies", "flatpak"]

  # ----- GitHub Actions (SHA-pinned updates) -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps(ci)"
    labels: ["dependencies", "github-actions"]
