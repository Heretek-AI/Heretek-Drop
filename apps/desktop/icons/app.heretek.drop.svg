<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#008844"/>
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)"/>
  <!-- Stylized "H" = hexagon shape from 3 bars -->
  <!-- Left bar -->
  <rect x="72" y="56" width="28" height="144" rx="14" fill="#ffffff"/>
  <!-- Right bar -->
  <rect x="156" y="56" width="28" height="144" rx="14" fill="#ffffff"/>
  <!-- Cross bar -->
  <rect x="72" y="106" width="112" height="28" rx="14" fill="#ffffff"/>
  <!-- Downward arrow in the cross bar for "download" -->
  <path d="M144 106 L144 134 M136 126 L144 134 L152 126" stroke="#00cc6a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
