app-id: app.heretek.drop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/heretek-drop/cargo
    RUSTUP_HOME: /usr/lib/sdk/rust-stable
command: heretek-drop
finish-args:
  # Network access
  - --share=network
  # X11 + Wayland
  - --socket=x11
  - --socket=wayland
  # File system access (downloads, config)
  - --filesystem=home
  # For opening auth URLs in the user's browser
  - --socket=session-bus
  # Notifications
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: heretek-drop
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/heretek-drop/cargo
    build-commands:
      # Build binary
      - cargo build --release --manifest-path=heretek-drop-src/apps/desktop/Cargo.toml
      - install -Dm755 -t /app/bin target/release/heretek-drop

      # Install icons (SVG + PNG multi-size)
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop.svg
      - install -Dm644 -t /app/share/icons/hicolor/32x32/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop-32.png
      - install -Dm644 -t /app/share/icons/hicolor/48x48/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop-48.png
      - install -Dm644 -t /app/share/icons/hicolor/64x64/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop-64.png
      - install -Dm644 -t /app/share/icons/hicolor/128x128/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop-128.png
      - install -Dm644 -t /app/share/icons/hicolor/256x256/apps heretek-drop-src/apps/desktop/icons/app.heretek.drop-256.png
      - install -Dm644 -t /app/share/applications heretek-drop-src/apps/desktop/flatpak/app.heretek.drop.desktop
      - install -Dm644 -t /app/share/mime/packages heretek-drop-src/apps/desktop/flatpak/app.heretek.drop.mimeinfo.xml
    sources:
      - type: dir
        path: ../../..
        dest: heretek-drop-src
