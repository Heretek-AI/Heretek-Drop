[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/desktop/crates/*",
]

# Lints applied across the entire workspace.
[workspace.lints]
clippy.all = { level = "warn", priority = -1 }
clippy.correctness = { level = "deny" }
clippy.perf = { level = "deny" }
clippy.style = { level = "warn", priority = -1 }
# AI_HARNESS_PLAN.md §5.2 — additional clippy lints, warn-level (non-breaking).
clippy.missing_panics_doc = { level = "warn", priority = -1 }
clippy.must_use_candidate = { level = "warn", priority = -1 }
clippy.doc_markdown = { level = "warn", priority = -1 }
clippy.cast_lossless = { level = "warn", priority = -1 }
clippy.redundant_closure = { level = "warn", priority = -1 }
clippy.single_match_else = { level = "warn", priority = -1 }
# Deny-level additions require per-crate overrides for test code;
# tracked separately so CI does not break during initial rollout.
# clippy.unwrap_used = "deny"          # planned: phase B follow-up
# clippy.expect_used = "deny"          # planned: phase B follow-up
# clippy.panicking_unwrap = "deny"     # planned: phase B follow-up
# clippy.wildcard_imports = "deny"     # planned: phase B follow-up
rustdoc.missing_docs = "warn"
rust.unused_must_use = "deny"
rust.unsafe_code = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Heretek-Drop contributors"]
repository = "https://github.com/heretek/Heretek-Drop"
publish = false      # Binary project; do not publish to crates.io.

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP + JWT
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
jsonwebtoken = "9.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Storage
# rustbreak = "0.29"  # dropped: only 2.0.0-rc3 available, inlined in database crate

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI / errors
anyhow = "1.0"
thiserror = "2.0"

# Config
toml = "0.8"
directories = "5.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# File dialogs
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Tauri-style shell (NOT TAURI — just async channels for IPC)
flume = "0.11"

# UI
slint = "1.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
