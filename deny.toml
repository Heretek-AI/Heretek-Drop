[graph]
exclude-dev = true

[licenses]
allow = [
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "MPL-2.0",
    "NCSA",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8

[bans]
deny = [
    # Prevent accidental openssl usage (use rustls)
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-probe" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
    # paste (transitive via Slint): unmaintained, no CVE, no upgrade path. ADR-0004.
    { id = "RUSTSEC-2024-0436", reason = "Transitive via Slint; no direct usage. Review at v0.2 stable cut." },
    # bincode (transitive via Slint → typed-index-collections): unmaintained. ADR-0004.
    { id = "RUSTSEC-2025-0141", reason = "Transitive via Slint 1.17 (typed-index-collections → bincode). No direct usage, no fix path until upstream Slint updates. Review at v0.2 stable cut." },
    # rustybuzz (transitive via Slint → usvg/resvg): unmaintained. ADR-0004.
    { id = "RUSTSEC-2026-0206", reason = "Transitive via Slint font rendering pipeline (usvg → resvg). No direct usage, no fix path until upstream Slint updates. Review at v0.2 stable cut." },
    # ttf-parser (transitive via Slint → winit → ab_glyph): unmaintained. ADR-0004.
    { id = "RUSTSEC-2026-0192", reason = "Transitive via Slint accessibility stack (winit → ab_glyph → owned_ttf_parser). No direct usage, no fix path until upstream Slint updates. Review at v0.2 stable cut." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
