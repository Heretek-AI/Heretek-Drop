# SonarCloud project — Heretek-Drop
# Language mix: Rust (Tauri 2 core) + TypeScript (Solid.js frontend)
sonar.projectKey=Heretek-Drop
sonar.organization=heretek
sonar.projectName=Heretek-Drop
sonar.projectVersion=0.1.0

# Defer SonarCloud wiring to v0.2 — project is too small to justify CI cost.
# sentinel: scanner would fail without server-side project registration.
# Enable in v0.2 by:
#   1. Create project at sonarcloud.io
#   2. Add SONAR_TOKEN to repo secrets
#   3. Uncomment sonar.organization/sonar.projectKey
#   4. Wire sonar-scanner step in ci.yml

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclude generated + toolchain output
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/target/**,**/coverage/**,**/__pycache__/**,**/.venv/**,**/*.d.ts,**/migrations/**,**/.nuxt/**,**/.output/**,**/upstream/**,**/test/**,**/tests/**,**/.omo/**,**/.codegraph/**

# Rust native (Tauri 2 core)
sonar.rust.file.suffixes=.rs

# JavaScript / TypeScript / Solid.js (.tsx)
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs,.vue
sonar.typescript.file.suffixes=.ts,.tsx
