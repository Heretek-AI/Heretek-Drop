# Codecov config — Heretek-Drop
# Coverage baseline: 0% at v0.1 launch. Range below is aspirational.
# CI does not gate on coverage (deferred to v0.2).
codecov:
  notify:
    wait_for_ci: yes
  require_ci_to_pass: yes
comment:
  behavior: default
  layout: reach,diff,flags,tree
  show_carryforward_flags: false
coverage:
  precision: 2
  range:
    - 60.0
    - 80.0
  round: down
  status:
    changes: false
    default_rules:
      flag_coverage_not_uploaded_behavior: include
    patch: true
    project: true
slack_app: false
